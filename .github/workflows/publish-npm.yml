name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish truesignal-cli to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.5.1 or newer (required for Trusted Publishing)
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Format check
        run: npx prettier --check .
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish to npm (Trusted Publishing, provenance is automatic)
        run: npm publish --access public
